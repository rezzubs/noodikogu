[workspace]
members = [".", "fuzz"]
default_members = ["."]

# Overflow silently wraps in release by default; panicking instead matches
# what dev builds already do and is cheap enough at this project's scale.
[profile.release]
overflow-checks = true

# Shared lint policy for every crate in the workspace. Each member crate
# opts in with `[lints] workspace = true` in its own Cargo.toml — new crates
# just need those two lines, not a repeated `#![warn(...)]` in their root.
[workspace.lints.clippy]
# `priority = -1` so a crate/module can still `#[allow(clippy::some_lint)]`
# to override one specific lint from the group without Cargo complaining
# about conflicting levels.
pedantic = { level = "warn", priority = -1 }
# `unwrap` is banned outside tests (use `expect` with a message instead).
# Each crate root pairs this with `#![cfg_attr(test, allow(clippy::unwrap_used))]`
# so it stays denied in production code but allowed in `#[cfg(test)]` modules.
unwrap_used = "deny"
# `as` casts skip the safety checks `Into`/`TryInto` give you; use those
# instead. If an `as` cast is truly needed, allow it locally with a `reason`
# explaining why (see `allow_attributes_without_reason` below).
as_conversions = "deny"
# Every `#[allow(...)]` anywhere in the workspace must say why, via
# `reason = "..."` — applies to the allows above too, so writing new ones
# without a reason fails the build.
allow_attributes_without_reason = "deny"

[package]
name = "noodikogu"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.0", features = ["derive"] }
# Present only to turn on `event-stream`, which gates crossterm's async
# `EventStream`. Cargo unifies features per crate version, so enabling it
# here also enables it on the instance ratatui already depends on, which is
# why the code keeps reaching crossterm through `ratatui::crossterm` rather
# than this dependency. Going through the re-export means the version can
# never drift out of step with ratatui's and leave two crossterms both
# reading stdin.
crossterm = { version = "0.29.0", features = ["event-stream"] }
# `StreamExt::next`, for polling the crossterm event stream.
futures-util = "0.3.32"
ratatui = "0.30.0"
sea-query = "1.0.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turso = "0.6.1"
unicode-normalization = "0.1.25"
